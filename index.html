    <button id="pwa-install-btn" class="pwa-install-btn" aria-label="Install App">
        <img src="logo1.png" alt="Install App">
        <span>Install App</span>
    </button>

    <script src="app.js" defer></script>
        <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>

    <!-- PWA Install Logic -->
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('pwa-install-btn');

        // Agar pehle se installed hai (standalone mode), button kabhi na dikhao
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches
            || window.navigator.standalone === true;

        if (!isStandalone) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBtn.style.display = 'flex'; // button show
            });
        }

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            installBtn.style.display = 'none'; // click karte hi hide
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
        });

        // Install ho jane par (kisi bhi tarah) button hamesha ke liye gayab
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA installed successfully');
        });
    </script>
</body>
